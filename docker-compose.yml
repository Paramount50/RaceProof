services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raceproof
      POSTGRES_USER: raceproof
      POSTGRES_PASSWORD: raceproof_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raceproof -d raceproof"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

